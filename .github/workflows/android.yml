name: Android CI

on:
  push:
    branches: [ "**" ]
    tags-ignore: [ "v*" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint ve derleme
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Birim testleri
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon lintRelease

      - name: Debug APK ve release AAB
        run: ./gradlew --no-daemon assembleDebug bundleRelease

      - name: Çıktıları yükle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: abonelik-takip-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 14
