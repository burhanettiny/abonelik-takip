name: Release

# "v1.0.0" gibi bir etiket gönderildiğinde imzalı AAB + APK üretir ve GitHub Release oluşturur.
# Gerekli repository secret'ları (Settings > Secrets and variables > Actions):
#   ABONE_KEYSTORE_BASE64   : upload-keystore.jks dosyasının base64 hâli
#   ABONE_KEYSTORE_PASSWORD : keystore şifresi
#   ABONE_KEY_ALIAS         : anahtar takma adı (ör. upload)
#   ABONE_KEY_PASSWORD      : anahtar şifresi
on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Keystore'u hazırla
        env:
          KEYSTORE_BASE64: ${{ secrets.ABONE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ABONE_KEYSTORE_BASE64 secret'ı tanımlı değil. docs/YAYINLAMA.md dosyasına bakın."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          echo "ABONE_KEYSTORE_PATH=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_ENV"

      - name: Test ve imzalı derleme
        env:
          ABONE_KEYSTORE_PASSWORD: ${{ secrets.ABONE_KEYSTORE_PASSWORD }}
          ABONE_KEY_ALIAS: ${{ secrets.ABONE_KEY_ALIAS }}
          ABONE_KEY_PASSWORD: ${{ secrets.ABONE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testReleaseUnitTest lintRelease bundleRelease assembleRelease

      - name: İmzayı doğrula
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab | tail -1

      - name: GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/mapping/release/mapping.txt
          generate_release_notes: true

      - name: Keystore'u temizle
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks"
