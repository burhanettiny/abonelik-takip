name: Store screenshots + release smoke test

# Emülatörde örnek verilerle Play Store ekran görüntülerini (TR + EN, açık + koyu) üretir.
# Actions sekmesinden elle çalıştırılır; görüntüler fastlane/metadata altına kopyalanıp depoya commit'lenir
# ve ayrıca "screenshots" artifact'ı olarak da yüklenir.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Debug APK ve (debug anahtarıyla imzalı) release APK
        run: |
          ./gradlew --no-daemon assembleDebug
          # Yalnızca duman testi için: release'i Android debug anahtarıyla imzala.
          ABONE_KEYSTORE_PATH="$HOME/.android/debug.keystore" ABONE_KEYSTORE_PASSWORD=android \
          ABONE_KEY_ALIAS=androiddebugkey ABONE_KEY_PASSWORD=android \
            ./gradlew --no-daemon assembleRelease

      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emülatörde ekran görüntüleri
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            bash scripts/smoke-test-release.sh
            bash scripts/take-screenshots.sh

      - uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: screenshots/

      - name: Görüntüleri depoya ekle
        run: |
          for l in tr-TR en-US; do
            d=fastlane/metadata/android/$l/images/phoneScreenshots
            mkdir -p "$d" && rm -f "$d"/*.png && cp screenshots/$l/*.png "$d"/
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fastlane/metadata/android/*/images/phoneScreenshots
          git diff --cached --quiet && { echo "Değişiklik yok"; exit 0; }
          git commit -m "Mağaza ekran görüntülerini güncelle [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
