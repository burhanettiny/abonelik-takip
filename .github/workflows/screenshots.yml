name: Store screenshots

# Emülatörde örnek verilerle Play Store ekran görüntülerini (TR + EN, açık + koyu) üretir.
# Actions sekmesinden elle çalıştırılır; çıktılar "screenshots" artifact'ı olarak indirilir.
on:
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emülatörde ekran görüntüleri
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/take-screenshots.sh

      - uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: screenshots/
